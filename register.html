<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>cadastra-se investidor</title>
</head>
<body>
    <main class="container">
        <form data-form="register">
            <h1>criar conta</h1>
            <div class="input-box">
                <input id="register-email" name="email" placeholder="email" type="email" autocomplete="username" required>
            </div>
            <div class="input-box">
                <input id="register-password" name="password" placeholder="senha" type="password" autocomplete="new-password" required>
            </div>
            <button type="submit">criar conta</button>
            <p class="form-message" role="alert"></p>

            <div class="register-link">
                <p>ja tem uma conta? <a href="login.html">fazer login</a></p>
            </div>
        </form>
    </main>
    <script src="script.js" defer></script>
</body>
</html>
