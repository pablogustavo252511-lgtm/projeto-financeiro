<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>investidor 20</title>
</head>
<body>
    <main class="container">
        <form data-form="login">
            <h1>login investidor</h1>
            <div class="input-box">
                <input id="login-email" name="email" placeholder="email" type="email" autocomplete="username" required>
            </div>
            <div class="input-box">
                <input id="login-password" name="password" placeholder="senha" type="password" autocomplete="current-password" required>
            </div>
            <div class="divide">
            <div class="remember-forgot">
                <label>
                <input type="checkbox">
                lembrar minha senha
            </label>
            </div>
            <a class="button_esqueci" href="#">esqueci minha senha</a>
            </div>
            <button type="submit">login</button>
            <p class="form-message" role="alert"></p>

            <div class="register-link">
                <p>não tem uma conta? <a href="register.html">cadastra-se</a></p>
            </div>
        </form>

    </main>
    <script src="script.js" defer></script>
</body>
</html>
